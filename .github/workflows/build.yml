name: Builder

on:
  workflow_call:
    inputs:
      arch:
        description: Architecture to build for (x86_64, arm64)
        type: string
        default: x86_64
      os:
        description: OS to build for (Linux, macOS, Windows)
        type: string
        default: Linux
      artifact_name:
        description: Name of the uploaded artifact
        type: string
        default: PluginLoader
      binary_name:
        description: Name of the PluginLoader binary
        type: string
        default: PluginLoader
      noconsole:
        description: If the windows build is no-console
        type: boolean
        default: false

jobs:
  build:
    name: Build ${{ inputs.artifact_name }} (${{ inputs.os }} ${{ inputs.arch }})
    # No support for mac x86, sorry
    runs-on: ${{
      (inputs.os == 'Linux' && inputs.arch == 'arm64' && 'ubuntu-26.04-arm') || 
      (inputs.os == 'Linux' && inputs.arch == 'x86_64' && 'ubuntu-26.04') ||
      (inputs.os == 'macOS' && inputs.arch == 'arm64' && 'xcode-27') || 
      (inputs.os == 'Windows' && inputs.arch == 'arm64' && 'windows-11-arm') ||
      (inputs.os == 'Windows' && inputs.arch == 'x86_64' && 'windows-2025')
       }}
    defaults:
      run:
        shell: bash

    steps:
    - name: Checkout 🧰
      uses: actions/checkout@v7
      with:
        fetch-depth: 0

    - name: Set up NodeJS 26 💎
      uses: actions/setup-node@v7
      with:
        node-version: 26
      
    - name: Set up Python 3.14.8 🐍
      uses: actions/setup-python@v7
      with:
        python-version: "3.14.8"
    
    - name: Install Poetry
      uses: snok/install-poetry@v1
      with:
        virtualenvs-create: false

    - name: Install Python dependencies ⬇️
      working-directory: ./backend
      run: |
        poetry self add "poetry-dynamic-versioning[plugin]"
        poetry install --no-interaction

    - name: Run backend tests 🧪
      working-directory: ./backend
      run: poetry run pytest -v

    - name: Install JS dependencies ⬇️
      working-directory: ./frontend
      run: |
        npm i -g pnpm
        pnpm i --frozen-lockfile

    - name: Build JS Frontend 🛠️
      working-directory: ./frontend
      run: pnpm run build

    - name: Build Python Backend 🛠️
      working-directory: ./backend
      run: |
        poetry dynamic-versioning 
        DECKY_REPO="${{ github.repository }}" DECKY_BRANCH="${{ github.event.number && format('PR{0}/{1}', github.event.number, github.head_ref) || github.ref_name }}" ${{ inputs.noconsole == true && 'DECKY_NOCONSOLE=1 ' || '' }}pyinstaller pyinstaller.spec
        echo Builds:
        ls ./dist

    - name: Verify bundled modules for plugins 🔍
      if: ${{ inputs.os == 'Windows' }}
      shell: bash
      run: ./backend/dist/PluginLoader.exe --check-imports linecache netrc pdb keyword reprlib sqlite3 psutil PIL pystray watchdog aiohttp certifi

    # Installed mode installs a onedir build (PluginLoader.exe plus _internal), windowed like the README advises.
    # Built once per architecture, in the noconsole job.
    - name: Build Windows installer (onedir) 🛠️
      if: ${{ inputs.os == 'Windows' && inputs.noconsole == true }}
      working-directory: ./backend
      run: |
        DECKY_REPO="${{ github.repository }}" DECKY_BRANCH="${{ github.event.number && format('PR{0}/{1}', github.event.number, github.head_ref) || github.ref_name }}" DECKY_NOCONSOLE=1 DECKY_ONEDIR=1 pyinstaller pyinstaller.spec --distpath dist-installer --workpath build-installer
        echo Installer build:
        ls ./dist-installer/PluginLoader

    - name: Verify bundled modules for plugins (installer) 🔍
      if: ${{ inputs.os == 'Windows' && inputs.noconsole == true }}
      shell: bash
      run: ./backend/dist-installer/PluginLoader/PluginLoader.exe --check-imports linecache netrc pdb keyword reprlib sqlite3 psutil PIL pystray watchdog aiohttp certifi

    - name: Zip Windows installer 📦
      if: ${{ inputs.os == 'Windows' && inputs.noconsole == true }}
      shell: pwsh
      run: Compress-Archive -Path ./backend/dist-installer/PluginLoader -DestinationPath ./backend/dist-installer/${{ inputs.arch == 'arm64' && 'PluginLoader-win-arm64-installer' || 'PluginLoader-win-installer' }}.zip

    - name: Upload installer artifact ⬆️
      if: ${{ inputs.os == 'Windows' && inputs.noconsole == true && !env.ACT }}
      uses: actions/upload-artifact@v7
      with:
        name: ${{ inputs.arch == 'arm64' && 'PluginLoader-win-arm64-installer' || 'PluginLoader-win-installer' }}
        path: ./backend/dist-installer/${{ inputs.arch == 'arm64' && 'PluginLoader-win-arm64-installer' || 'PluginLoader-win-installer' }}.zip

    - name: Upload package artifact ⬆️
      if: ${{ !env.ACT }}
      uses: actions/upload-artifact@v7
      with:
        name: ${{ inputs.artifact_name }}
        path: ./backend/dist/${{ inputs.binary_name }}

    - name: Download package artifact locally
      if: ${{ env.ACT }}
      uses: actions/upload-artifact@v7
      with:
        path: ./backend/dist/${{ inputs.binary_name }}
